<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Experiences El Salvador">
  <defs>
    <clipPath id="tri"><path d="M120 30 L200 172 L40 172 Z"/></clipPath>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7e3"/>
      <stop offset="1" stop-color="#fde3a7"/>
    </linearGradient>
  </defs>

  <!-- Laurel: dos ramas que abrazan el triángulo -->
  <g fill="#2f6b52">
    <g id="rama">
      <path d="M58 196 C34 176 24 144 30 110" fill="none" stroke="#2f6b52" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="31" cy="118" rx="4.2" ry="10" transform="rotate(-18 31 118)"/>
      <ellipse cx="22" cy="126" rx="4.2" ry="10" transform="rotate(-62 22 126)"/>
      <ellipse cx="32" cy="138" rx="4.2" ry="10" transform="rotate(-10 32 138)"/>
      <ellipse cx="22" cy="148" rx="4.2" ry="10" transform="rotate(-70 22 148)"/>
      <ellipse cx="37" cy="158" rx="4.2" ry="10" transform="rotate(-2 37 158)"/>
      <ellipse cx="28" cy="170" rx="4.2" ry="10" transform="rotate(-78 28 170)"/>
      <ellipse cx="46" cy="176" rx="4.2" ry="10" transform="rotate(12 46 176)"/>
      <ellipse cx="40" cy="189" rx="4.2" ry="10" transform="rotate(-84 40 189)"/>
      <ellipse cx="29" cy="104" rx="3.6" ry="8.5" transform="rotate(8 29 104)"/>
    </g>
    <use href="#rama" transform="translate(240 0) scale(-1 1)"/>
  </g>

  <!-- Interior del triángulo -->
  <g clip-path="url(#tri)">
    <rect x="30" y="20" width="180" height="160" fill="url(#cielo)"/>
    <!-- Sol naciente con rayos -->
    <g stroke="#f4b942" stroke-width="3" stroke-linecap="round" opacity=".9">
      <line x1="120" y1="118" x2="120" y2="40"/>
      <line x1="120" y1="118" x2="86" y2="50"/>
      <line x1="120" y1="118" x2="154" y2="50"/>
      <line x1="120" y1="118" x2="62" y2="78"/>
      <line x1="120" y1="118" x2="178" y2="78"/>
      <line x1="120" y1="118" x2="48" y2="112"/>
      <line x1="120" y1="118" x2="192" y2="112"/>
    </g>
    <circle cx="120" cy="118" r="24" fill="#f4b942"/>
    <circle cx="120" cy="118" r="24" fill="none" stroke="#e39b1f" stroke-width="2"/>
    <!-- Cinco volcanes, como en el escudo: el central más alto -->
    <path fill="#4f8a80" d="M44 160 L70 135 Q71.5 132 74 132 Q76.5 132 78 135 L104 160 Z M136 160 L162 135 Q163.5 132 166 132 Q168.5 132 170 135 L196 160 Z"/>
    <path fill="#2f6b6f" d="M66 160 L92 121 Q93.5 118 96 118 Q98.5 118 100 121 L126 160 Z M114 160 L140 121 Q141.5 118 144 118 Q146.5 118 148 121 L174 160 Z"/>
    <path fill="#173f45" d="M84 160 L116 103 Q117.5 100 120 100 Q122.5 100 124 103 L156 160 Z"/>
    <!-- Mar: azul y blanco de la bandera -->
    <rect x="30" y="156" width="180" height="24" fill="#0f47af"/>
    <path d="M30 164 q10 -5 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#ffffff" stroke-width="3.2"/>
  </g>

  <!-- Marco del triángulo -->
  <path d="M120 30 L200 172 L40 172 Z" fill="none" stroke="#f4b942" stroke-width="7" stroke-linejoin="round"/>

  <!-- Cinta inferior -->
  <path d="M70 186 L170 186 L176 198 L170 210 L70 210 L64 198 Z" fill="#b8481c"/>
  <text x="120" y="203" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#ffffff">EL SALVADOR</text>
</svg>

# Netlify detecta Next.js y aplica su adaptador oficial (OpenNext) solo:
# no hace falta instalar ningún plugin. Este archivo fija lo mínimo.
#
# La base es PostgreSQL en Neon (DATABASE_URL y DIRECT_URL en las variables
# de Netlify). Cada build aplica las migraciones pendientes antes de
# compilar; si una falla, el deploy se detiene y el sitio anterior sigue en
# línea. Ver docs/DEPLOY_NETLIFY.md.

[build]
  command = "pnpm prisma migrate deploy && pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # La misma versión de pnpm que generó pnpm-lock.yaml.
  PNPM_VERSION = "12.3.4"
